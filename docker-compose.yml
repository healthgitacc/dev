version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hospital_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hospital_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hospital_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hospital_api
    environment:
      # Database
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-hospital_db}
      SQL_ECHO: ${SQL_ECHO:-false}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-minimum-32-characters-long-please}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # API Settings
      DEBUG: ${DEBUG:-false}
      API_TITLE: ${API_TITLE:-Hospital Appointment & Medical Record Management}
      API_VERSION: ${API_VERSION:-1.0.0}
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      
      # Reminders
      REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
      REMINDER_HOUR: ${REMINDER_HOUR:-8}
      REMINDER_MINUTE: ${REMINDER_MINUTE:-0}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-24}
      
      # Twilio (Optional)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    
    ports:
      - "8000:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
    
    volumes:
      - ./backend:/app
      - /app/__pycache__
    
    networks:
      - hospital_network
    
    restart: unless-stopped
    
    command: >
      sh -c "
        echo '⏳ Waiting for database...' &&
        sleep 5 &&
        echo '🗄️  Running migrations...' &&
        alembic upgrade head &&
        echo '🚀 Starting FastAPI server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # PgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hospital_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hospital_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  hospital_network:
    driver: bridge
